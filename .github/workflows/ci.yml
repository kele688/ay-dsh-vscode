name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Leak scan (internal machinery must never be published)
        run: node scripts/verify-no-leaks.mjs

      - name: Build (esbuild + media)
        run: node scripts/build.mjs

      - name: Verify committed host bundle is in sync with source
        # build.mjs regenerates host/agent-host.bundle.mjs; a diff here means the
        # committed bundle drifted from host/agent-host.mjs (dev-mode installs and
        # reviews would run a stale/different bundle than the source).
        run: |
          git diff --exit-code -- host/agent-host.bundle.mjs \
            || { echo "host/agent-host.bundle.mjs is out of sync — run 'npm run build' and commit the regenerated bundle"; exit 1; }

      - name: Host boot smoke test (isolated DSH home)
        run: node scripts/verify-host-boot.mjs

      - name: Package VSIX
        run: node scripts/package.mjs

      - name: Verify VSIX artifact
        run: test -f release/ay-dsh-vscode.vsix && echo "VSIX OK"

      - name: Verify host syntax
        run: node --check host/agent-host.mjs

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify no non-permissive licenses in production closure
        run: |
          node scripts/scan-licenses.mjs
          if grep -q '^## UNKNOWN' THIRD-PARTY-NOTICES.md; then
            echo "UNKNOWN licenses found — review required"
            exit 1
          fi
          echo "License scan clean"
